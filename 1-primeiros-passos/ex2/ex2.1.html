<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Leia dois números e mostre o maior deles.

        var numero1 = prompt ("Digita um número")
        var numero2 = prompt ("Digita o segundo número")

        if (numero1 > numero2){
            alert ("O número 1: " + numero1 + " é o maior")
        } else if ( numero1 < numero2) {
            alert ("O número 2: " + numero2 + " é o maior")
        } else {
            alert ("Os numeros são iguais")
        }
    </script>
    
</body>
</html>
