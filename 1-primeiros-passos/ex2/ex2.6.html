<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Leia 4 valores diferentes e informe apenas o primeiro, o último e o maior deles.

        var num1 = Number(prompt("Digite seu primeiro numero: "))
        var num2 = Number(prompt("Digite seu segundo numero: "))
        var num3 = Number(prompt("Digite seu terceiro numero: "))
        var num4 = Number(prompt("Digite seu quarto numero: "))

        var maiornumero 

        if (num1 > num2 && num1 > num3 && num1 > num4) {
            maiornumero = "Primeiro"
        } else if (num2 > num1 && num2 > num3 && num2 > num4) {
            maiornumero = "Segundo"
        } else if (num3 > num1 && num3 > num2 && num3 > num4) {
            maiornumero = "Terceiro"
        } else if (num4 > num1 && num4 > num2 && num4 > num3) {
            maiornumero = "Quarto"
        }

        alert ("O primeiro numero foi: " + num1 + " , o ultimo foi o: " + num4 + " e o maior deles é o: " + maiornumero)
    </script>
</body>
</html>
