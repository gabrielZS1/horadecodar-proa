<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Leia dois valores. Enquanto o segundo valor for menor ou igual a zero, peça novamente esse mesmo valor. 
        // Ao final, mostre a divisão do primeiro pelo segundo.

        var primeiro = Number(prompt("Digite o primeiro valor"))
        var segundo = Number(prompt("Digite o segundo valor"))

        while (segundo <= 0) {
            alert("Segundo valor inválido, digite novamente")
            segundo = Number(prompt("Digite o segundo valor"))
        }

        var divisao = primeiro / segundo
        alert("A divisão do primeiro pelo segundo é: " + divisao)
    </script>
</body>
</html>
