<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Leia dois valores. Enquanto o segundo valor for menor ou igual a zero, peça novamente esse mesmo valor. Ao final, mostre a divisão do primeiro pelo segundo.

        var num1 = Number(prompt("Digite seu primeiro numero"))
        var num2 = Number(prompt("Digite seu primeiro numero"))

        while (num2 <= 0) {
            alert ("O segundo numero deve ser maior que 0")

            num2 = Number(prompt("Digite seu segundo numero novamente"))
        }
        
        var divisao = num1 / num2

        alert ("A divisão dos 2 numeros é: " + divisao)
    </script>
</body>
</html>
