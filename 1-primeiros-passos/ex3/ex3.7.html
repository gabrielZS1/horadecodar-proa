<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Leia um valor `N` (N > 0) e imprima todos os inteiros de 1 até `N`.

        var n = Number(prompt("Digite um valor N (N > 0)"))

        while (n <= 0) {
            alert("Valor inválido, digite um número maior que zero")
            n = Number(prompt("Digite um valor N (N > 0)"))
        }

        for (let i = 1; i <= n; i++) {
            console.log(i)
        }

    </script>
</body>
</html>
