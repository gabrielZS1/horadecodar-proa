<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Leia 10 valores e informe quantos estão no intervalo de 24 a 42 (inclusive) e quantos estão fora.

        var dentro = 0
        var fora = 0

        for (let i = 0; i < 10; i++) {
            var valor = Number(prompt("Digite um valor"))
            if (valor >= 24 && valor <= 42) {
                dentro++
            } else {
                fora++
            }
        }

        alert("Quantidade de valores dentro do intervalo: " + dentro)
        alert("Quantidade de valores fora do intervalo: " + fora)
    </script>
</body>
</html>
