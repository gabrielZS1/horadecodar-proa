<html>

<head>

	<script>

		const nome_hotel = 'Transilvânia';
		const senha = '2678';
		var nome;

		var quartos = [];
		for (var i = 1; i <= 20; i++) {
			quartos.push('livre');
		}

		var reservas = [];

		var hospedes = [];

		var eventos_confirmados = [];

		function formatarMoeda(valor) {
			return 'R$ ' + valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
		}

		function respostaSim(resposta) {
			if (resposta === null) {
				return false;
			}

			return resposta.toUpperCase() === 'S';
		}

		function login() {

			alert(`Bem-vindo ao ${nome_hotel}`);

			nome = prompt('Informe seu nome:');
			var senha_digitada = prompt(`${nome}, informe a senha:`);
			var tentativas = 3;
			var permissao = false;

			while (tentativas > 0 && permissao == false) {

				if (senha_digitada === senha) {
					permissao = true;
				} else {
					tentativas--;

					if (tentativas === 0) {
						alert('Número de tentativas excedido. Acesso negado.');
						window.close();
					} else {
						senha_digitada = prompt(`${nome}, informe a senha, você tem mais ${tentativas} tentativas:`);
					}
				}
			}

			if (permissao == true) {
				alert(`Bem-vindo ao Hotel ${nome_hotel}, ${nome}. É um imenso prazer ter você por aqui!`);
				inicio();
			}
		}


		function inicio() {

			var escolha = parseInt(prompt('Selecione uma opção 1.) Reservas de Quartos 2.) Cadastro de Hóspedes 3.) Eventos 4.) Ar-Condicionado 5.) Abastecimento 6.) Relatórios Operacionais 7.) Sair'));

			if (escolha === 1) {
				reserva_quartos();
			} else if (escolha === 2) {
				cadastro_hospedes();
			} else if (escolha === 3) {
				eventos();
			} else if (escolha === 4) {
				ar_condicionado();
			} else if (escolha === 5) {
				abastecimento();
			} else if (escolha === 6) {
				relatorios_operacionais();
			} else if (escolha === 7) {
				sair();
			} else {
				erro();
			}

		}

		function reserva_quartos() {

			var diaria = parseFloat(prompt('Informe o valor da diária:'));
			var diarias = parseInt(prompt('Informe a quantidade de diárias (1-30):'));

			if (isNaN(diaria) || diaria <= 0 || isNaN(diarias) || diarias < 1 || diarias > 30) {
				alert('Valor inválido, ' + nome);
				inicio();
			} else {

				var hospede = prompt('Informe o nome do hóspede:');

				var tipo_quarto = prompt('Tipo de quarto (S/E/L):');
				tipo_quarto = tipo_quarto.toUpperCase();

				var fator = 1;
				var nome_tipo = 'Standard';

				if (tipo_quarto === 'E') {
					fator = 1.35;
					nome_tipo = 'Executivo';
				} else if (tipo_quarto === 'L') {
					fator = 1.65;
					nome_tipo = 'Luxo';
				}

				var quarto = parseInt(prompt('Escolha um quarto (1-20):'));

				while (quartos[quarto - 1] === 'ocupado') {
					alert('Quarto já está ocupado');

					var lista_livres = '';
					for (var i = 0; i < 20; i++) {
						if (quartos[i] === 'livre') {
							lista_livres = lista_livres + (i + 1) + ' ';
						}
					}

					alert('Quartos livres: ' + lista_livres);

					quarto = parseInt(prompt('Escolha outro quarto (1-20):'));
				}

				var subtotal = diaria * diarias * fator;
				var taxa = subtotal * 0.10;
				var total = subtotal + taxa;

				alert('Resumo:\nHóspede: ' + hospede + '\nQuarto: ' + quarto + ' (' + nome_tipo + ')\nSubtotal: ' + formatarMoeda(subtotal) + '\nTaxa de serviço (10%): ' + formatarMoeda(taxa) + '\nTotal: ' + formatarMoeda(total));

				var confirma = prompt(nome + ', confirma a reserva? (S/N):');

				if (respostaSim(confirma)) {
					quartos[quarto - 1] = 'ocupado';
					reservas.push({ hospede: hospede, quarto: quarto, diarias: diarias, total: total });
					alert('Reserva efetuada com sucesso.');
				} else {
					alert('Reserva não efetuada.');
				}

				mapa_quartos();

				inicio();
			}
		}

		function mapa_quartos() {
			var mapa = '';

			for (var i = 0; i < 20; i++) {
				if (quartos[i] === 'livre') {
					mapa = mapa + 'L ';
				} else {
					mapa = mapa + 'O ';
				}

				if ((i + 1) % 4 === 0) {
					mapa = mapa + '\n';
				}
			}

			alert('Mapa de quartos:\n' + mapa);
		}

		function cadastro_hospedes() {

			var escolha_hospedes = parseInt(prompt('[Cadastro de Hóspedes]\n1-Cadastrar 2-Pesquisar exato 3-Pesquisar prefixo 4-Listar 5-Atualizar 6-Remover 7-Voltar'));

			if (escolha_hospedes === 1) {
				cadastrar_hospede();
			} else if (escolha_hospedes === 2) {
				pesquisar_hospede_exato();
			} else if (escolha_hospedes === 3) {
				pesquisar_hospede_prefixo();
			} else if (escolha_hospedes === 4) {
				listar_hospedes();
			} else if (escolha_hospedes === 5) {
				atualizar_hospede();
			} else if (escolha_hospedes === 6) {
				remover_hospede();
			} else if (escolha_hospedes === 7) {
				inicio();
			} else {
				erro_cadastro_hospedes();
			}
		}

		function cadastrar_hospede() {

			if (hospedes.length >= 15) {
				alert('Máximo de cadastros atingido');
			} else {

				var nome_hospede = prompt('Nome do hóspede:');
				var ja_cadastrado = false;

				for (var i = 0; i < hospedes.length; i++) {
					if (hospedes[i].nome === nome_hospede) {
						ja_cadastrado = true;
					}
				}

				if (ja_cadastrado) {
					alert('Hóspede já cadastrado');
				} else {
					hospedes.push({ nome: nome_hospede, data: new Date().toLocaleString() });
					alert('Hóspede cadastrado com sucesso.');
				}
			}

			cadastro_hospedes();
		}

		function pesquisar_hospede_exato() {

			var nome_procurado = prompt('Nome do hóspede para pesquisa exata:');
			var encontrado = false;

			for (var i = 0; i < hospedes.length; i++) {
				if (hospedes[i].nome === nome_procurado) {
					encontrado = true;
				}
			}

			if (encontrado) {
				alert('Hospede ' + nome_procurado + ' foi encontrado');
			} else {
				alert('Hóspede não encontrado');
			}

			cadastro_hospedes();
		}

		function pesquisar_hospede_prefixo() {

			var prefixo = prompt('Prefixo:');
			var resultados = '';
			var contador = 0;

			for (var i = 0; i < hospedes.length; i++) {
				if (hospedes[i].nome.toUpperCase().indexOf(prefixo.toUpperCase()) === 0) {
					contador++;
					resultados = resultados + '[' + contador + '] ' + hospedes[i].nome + '\n';
				}
			}

			if (contador === 0) {
				alert('Hóspede não encontrado');
			} else {
				alert('Resultados:\n' + resultados);
			}

			cadastro_hospedes();
		}

		function listar_hospedes() {

			if (hospedes.length === 0) {
				alert('Nenhum hóspede cadastrado');
			} else {

				hospedes.sort(function (a, b) {
					if (a.nome.toUpperCase() < b.nome.toUpperCase()) {
						return -1;
					} else if (a.nome.toUpperCase() > b.nome.toUpperCase()) {
						return 1;
					} else {
						return 0;
					}
				});

				var lista = '';

				for (var i = 0; i < hospedes.length; i++) {
					lista = lista + '[' + (i + 1) + '] ' + hospedes[i].nome + ' - ' + hospedes[i].data + '\n';
				}

				alert('Hóspedes cadastrados:\n' + lista);
			}

			cadastro_hospedes();
		}

		function atualizar_hospede() {

			listar_hospedes_sem_menu();
			var indice = parseInt(prompt('Informe o índice do hóspede que deseja atualizar:'));

			if (isNaN(indice) || indice < 1 || indice > hospedes.length) {
				alert('Hóspede não encontrado');
			} else {

				var novo_nome = prompt('Novo nome do hóspede:');
				hospedes[indice - 1].nome = novo_nome;
				alert('Operação realizada com sucesso');
			}

			cadastro_hospedes();
		}

		function remover_hospede() {

			listar_hospedes_sem_menu();
			var indice = parseInt(prompt('Informe o índice do hóspede que deseja remover:'));

			if (isNaN(indice) || indice < 1 || indice > hospedes.length) {
				alert('Hóspede não encontrado');
			} else {

				hospedes.splice(indice - 1, 1);
				alert('Operação realizada com sucesso');
			}

			cadastro_hospedes();
		}

		function listar_hospedes_sem_menu() {

			var lista = '';

			for (var i = 0; i < hospedes.length; i++) {
				lista = lista + '[' + (i + 1) + '] ' + hospedes[i].nome + '\n';
			}

			alert('Hóspedes cadastrados:\n' + lista);
		}

		function erro_cadastro_hospedes() {
			alert('Por favor, informe um número entre 1 e 7');
			cadastro_hospedes();
		}

		function eventos() {

			var convidados = parseInt(prompt('Convidados:'));

			if (isNaN(convidados) || convidados < 0 || convidados > 350) {
				alert('Número de convidados inválido');
				inicio();
			} else {

				var auditorio = '';
				var cadeiras_adicionais = 0;

				if (convidados <= 220) {
					auditorio = 'Laranja';

					if (convidados > 150) {
						cadeiras_adicionais = convidados - 150;
					}
				} else {
					auditorio = 'Colorado';
				}

				if (cadeiras_adicionais > 0) {
					alert('Auditório selecionado: ' + auditorio + ' (' + cadeiras_adicionais + ' cadeiras adicionais)');
				} else {
					alert('Auditório selecionado: ' + auditorio);
				}

				var dia = prompt('Dia:');
				dia = dia.toLowerCase();

				var hora_inicial = Number(prompt('Hora inicial:'));
				var duracao = parseInt(prompt('Duração:'));

				var abertura = 7;
				var fechamento = 23;

				if (dia === 'sabado' || dia === 'domingo') {
					fechamento = 15;
				}

				var hora_final = hora_inicial + duracao;

				if (isNaN(hora_inicial) || hora_inicial % 1 !== 0 || isNaN(duracao) || duracao < 1 || duracao > 12 || hora_inicial < abertura || hora_final > fechamento) {
					alert('Auditório indisponível para o horário informado.');
					inicio();
				} else {

					var empresa = prompt('Empresa:');
					alert('Auditório reservado para ' + empresa + ': ' + dia + ' às ' + hora_inicial + 'hs');

					var base_garcons = Math.ceil(convidados / 12);
					var reforco_garcons = Math.floor(duracao / 2);
					var total_garcons = base_garcons + reforco_garcons;
					var custo_garcons = total_garcons * duracao * 10.50;

					var cafe = convidados * 0.2;
					var agua = convidados * 0.5;
					var salgados = convidados * 7;

					var custo_cafe = cafe * 0.80;
					var custo_agua = agua * 0.40;
					var custo_salgados = (salgados / 100) * 34.00;
					var custo_buffet = custo_cafe + custo_agua + custo_salgados;

					var total_evento = custo_garcons + custo_buffet;

					var relatorio = 'Relatório do Evento\n';
					relatorio = relatorio + 'Auditório: ' + auditorio + '\n';
					relatorio = relatorio + 'Empresa: ' + empresa + '\n';
					relatorio = relatorio + 'Dia: ' + dia + '\n';
					relatorio = relatorio + 'Hora início: ' + hora_inicial + 'hs\n';
					relatorio = relatorio + 'Hora fim: ' + hora_final + 'hs\n';
					relatorio = relatorio + 'Convidados: ' + convidados + '\n';
					relatorio = relatorio + 'Duração: ' + duracao + 'h\n';
					relatorio = relatorio + 'Garçons necessários: ' + total_garcons + '\n';
					relatorio = relatorio + 'Custo com garçons: ' + formatarMoeda(custo_garcons) + '\n';
					relatorio = relatorio + '\nBuffet:\n';
					relatorio = relatorio + 'Café: ' + cafe + ' L\n';
					relatorio = relatorio + 'Água: ' + agua + ' L\n';
					relatorio = relatorio + 'Salgados: ' + salgados + ' un\n';
					relatorio = relatorio + 'Custo buffet: ' + formatarMoeda(custo_buffet) + '\n';
					relatorio = relatorio + '\nTotal do evento: ' + formatarMoeda(total_evento);

					alert(relatorio);

					var confirma = prompt('Confirmar reserva? (S/N):');

					if (respostaSim(confirma)) {
						eventos_confirmados.push({ empresa: empresa, auditorio: auditorio, convidados: convidados, total: total_evento });
						alert('Reserva efetuada com sucesso.');
					} else {
						alert('Reserva não efetuada.');
					}

					inicio();
				}
			}
		}

		function ar_condicionado() {

			var orcamentos = [];
			var continuar = 'S';

			while (respostaSim(continuar)) {

				var empresa = prompt('Empresa:');
				var valor_aparelho = parseFloat(prompt('Valor por aparelho:'));
				var quantidade = parseInt(prompt('Quantidade:'));
				var desconto_percentual = parseFloat(prompt('Desconto (%):'));
				var minimo = parseInt(prompt('Mínimo para desconto:'));
				var deslocamento = parseFloat(prompt('Deslocamento:'));

				var bruto = valor_aparelho * quantidade;
				var desconto_valor = 0;

				if (quantidade >= minimo) {
					desconto_valor = bruto * (desconto_percentual / 100);
				}

				var total = bruto - desconto_valor + deslocamento;

				alert('O serviço de ' + empresa + ' custará ' + formatarMoeda(total));

				orcamentos.push({ empresa: empresa, total: total });

				continuar = prompt('Deseja informar novos dados, ' + nome + '? (S/N):');
			}

			var menor = orcamentos[0];
			var maior = orcamentos[0];

			for (var i = 1; i < orcamentos.length; i++) {
				if (orcamentos[i].total < menor.total) {
					menor = orcamentos[i];
				}

				if (orcamentos[i].total > maior.total) {
					maior = orcamentos[i];
				}
			}

			var diferenca_percentual = ((maior.total - menor.total) / menor.total) * 100;

			alert('Melhor orçamento: ' + menor.empresa + ' — ' + formatarMoeda(menor.total) + '\nMaior orçamento: ' + maior.empresa + ' — ' + formatarMoeda(maior.total) + '\nDiferença percentual: ' + diferenca_percentual.toFixed(2) + '%');

			inicio();
		}

		function abastecimento() {

			var postos = [
				{ nome: 'Wayne Oil' },
				{ nome: 'Stark Petrol' }
			];

			for (var i = 0; i < postos.length; i++) {
				postos[i].alcool = parseFloat(prompt(postos[i].nome + ' -> Preço do álcool:'));
				postos[i].gasolina = parseFloat(prompt(postos[i].nome + ' -> Preço da gasolina:'));

				if (postos[i].alcool <= postos[i].gasolina * 0.70) {
					postos[i].combustivel = 'Álcool';
					postos[i].preco = postos[i].alcool;
				} else {
					postos[i].combustivel = 'Gasolina';
					postos[i].preco = postos[i].gasolina;
				}

				postos[i].total = postos[i].preco * 42;
			}

			postos.sort(function (a, b) {
				return a.total - b.total;
			});

			var ranking = '';

			for (var i = 0; i < postos.length; i++) {
				ranking = ranking + postos[i].nome + ': melhor opção = ' + postos[i].combustivel + ' | Total (42L) = ' + formatarMoeda(postos[i].total) + '\n';
			}

			alert(ranking);

			var melhor = postos[0];

			alert(nome + ', é mais barato abastecer com ' + melhor.combustivel.toLowerCase() + ' no posto ' + melhor.nome + '.');

			inicio();
		}

		function relatorios_operacionais() {

			var quartos_ocupados = 0;

			for (var i = 0; i < quartos.length; i++) {
				if (quartos[i] === 'ocupado') {
					quartos_ocupados++;
				}
			}

			var taxa_ocupacao = (quartos_ocupados / 20) * 100;

			var receita_hospedagem = 0;

			for (var i = 0; i < reservas.length; i++) {
				receita_hospedagem = receita_hospedagem + reservas[i].total;
			}

			var receita_eventos = 0;

			for (var i = 0; i < eventos_confirmados.length; i++) {
				receita_eventos = receita_eventos + eventos_confirmados[i].total;
			}

			var receita_total = receita_hospedagem + receita_eventos;

			var relatorio = 'RELATÓRIOS OPERACIONAIS\n\n';
			relatorio = relatorio + 'Reservas de quartos confirmadas: ' + reservas.length + '\n';
			relatorio = relatorio + 'Taxa de ocupação atual: ' + taxa_ocupacao.toFixed(2) + '%\n';
			relatorio = relatorio + 'Hóspedes cadastrados: ' + hospedes.length + '\n';
			relatorio = relatorio + 'Eventos confirmados: ' + eventos_confirmados.length + '\n\n';
			relatorio = relatorio + 'Receita hospedagem: ' + formatarMoeda(receita_hospedagem) + '\n';
			relatorio = relatorio + 'Receita eventos: ' + formatarMoeda(receita_eventos) + '\n';
			relatorio = relatorio + 'Receita total: ' + formatarMoeda(receita_total);

			alert(relatorio);

			inicio();
		}

		function erro() {
			alert('Por favor, informe um número entre 1 e 7');
			inicio();
		}

		function sair() {
			var confirma = confirm('Você deseja sair?');
			if (confirma) {
				alert(`Muito obrigado e até logo, ${nome}.`);
				window.close();
			} else {
				inicio();
			}
		}



		login();
	</script>
</head>
